[workspace]
members = ["shared", "program", "script"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
sp1-build = "=6.1.0"
sp1-sdk = "=6.1.0"
sp1-zkvm = "=6.1.0"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.0.0" }

[profile.release]
lto = "thin"
