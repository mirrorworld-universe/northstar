[package]
name = "northstar-zkvm-replay-script"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["sp1-sdk/cuda", "sp1-sdk/groth16-cuda"]
profiling = ["sp1-sdk/profiling"]

[dependencies]
anyhow = "1"
hex = "0.4"
northstar-zkvm-replay-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp1-sdk.workspace = true
sp1-verifier = "=6.8.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[build-dependencies]
sp1-build.workspace = true
