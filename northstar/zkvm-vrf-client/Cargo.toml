[workspace]
resolver = "2"

[package]
name = "northstar-zkvm-vrf-client"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["sdk"]
sdk = ["dep:sp1-sdk", "dep:tokio", "dep:bincode", "dep:futures-util"]
cuda = ["sdk", "sp1-sdk/cuda", "sp1-sdk/groth16-cuda"]

[[bin]]
name = "northstar-zkvm-vrf-client"
path = "src/main.rs"
required-features = ["sdk"]

[dependencies]
anyhow = "1"
bincode = { version = "=1.3.3", optional = true }
borsh = { version = "1", features = ["derive"] }
bs58 = { version = "=0.5.1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
hex = "0.4"
northstar-zk-types = { path = "../zk-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.8.0", default-features = false, optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }

[profile.release]
lto = "thin"
