[package]
name = "northstar-geyser-events"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agave-geyser-plugin-interface.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
solana-clock.workspace = true
solana-pubkey = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[dev-dependencies]
solana-hash.workspace = true
solana-message.workspace = true
solana-signature.workspace = true
solana-transaction.workspace = true
solana-transaction-error.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
