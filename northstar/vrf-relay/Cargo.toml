[package]
name = "northstar-vrf-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

# The service and its embedded client use the same implementation and wire checks.
[lib]
path = "src/lib.rs"

[features]
default = []
local-prover = []

[dependencies]
northstar-vrf-protocol = { path = "../vrf-interface" }
anyhow = "=1.0.104"
solana-pubkey = { version = "=4.4.0", features = ["curve25519", "serde"] }
solana-instruction = "=4.0.0"
curve25519-dalek = "=5.0.0"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
vrf-rfc9381 = { version = "=0.0.7", features = ["edwards25519"] }
zeroize = "1.8.2"
url = "=2.5.8"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "=0.22.1"
bincode = "=1.3.3"
bs58 = "=0.5.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
solana-hash = "=4.7.0"
solana-keypair = "=4.0.0"
solana-message = { version = "=5.1.0", features = ["serde", "wincode"] }
solana-signer = "=4.0.0"
solana-transaction = { version = "=5.1.0", features = ["serde", "wincode", "verify"] }
tempfile = "=3.27.0"
libc = "0.2"
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
getrandom = "=0.3.4"
subtle = "=2.6.1"
percent-encoding = "=2.3.2"
