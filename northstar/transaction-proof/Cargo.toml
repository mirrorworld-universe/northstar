[package]
name = "northstar-transaction-proof"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate_fixture"
path = "src/bin/generate_fixture.rs"
required-features = ["host"]

[features]
default = ["host"]
cycle-tracking = []
host = [
    "dep:agave-feature-set",
    "dep:bincode",
    "dep:solana-account",
    "dep:solana-program-runtime",
    "dep:solana-pubkey",
    "dep:northstar-replay-harness",
    "dep:solana-sha256-hasher",
    "dep:solana-svm",
    "dep:solana-svm-transaction",
]

[dependencies]
ark-bn254 = "0.6"
ark-ff = "0.6"
# light-poseidon 0.4 still uses Arkworks 0.5; isolate its field types at the adapter boundary.
poseidon-ark-bn254 = { package = "ark-bn254", version = "0.5" }
poseidon-ark-ff = { package = "ark-ff", version = "0.5" }
borsh = { workspace = true, features = ["derive"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
light-poseidon = "0.4"
northstar-zk-types = { workspace = true }
thiserror = { workspace = true }

agave-feature-set = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-program-runtime = { workspace = true, optional = true }
solana-pubkey = { workspace = true, optional = true }
northstar-replay-harness = { workspace = true, optional = true }
solana-sha256-hasher = { workspace = true, optional = true }
solana-svm = { workspace = true, optional = true }
solana-svm-transaction = { workspace = true, optional = true }

[target.'cfg(not(target_os = "zkvm"))'.dependencies]
sha2 = "0.11"

# SP1's precompile patch targets 0.10.9; native hashing stays on 0.11.
[target.'cfg(target_os = "zkvm")'.dependencies]
sha2-sp1 = { package = "sha2", git = "https://github.com/sp1-patches/RustCrypto-hashes", rev = "e48b656ebc806117554bb33c2f8687e4637e37ff" }

[dev-dependencies]
hex = "0.4"
solana-fee-structure = { workspace = true }

[lints]
workspace = true
