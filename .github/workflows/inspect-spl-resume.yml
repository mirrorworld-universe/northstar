name: Inspect SPL resume admission

on:
  push:
    branches: [spl-resume]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: devnet
    timeout-minutes: 5
    steps:
      - name: Inspect retained SPL public accounts
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          FEE_PAYER_PUBLIC_KEY=$(solana-keygen pubkey /tmp/northstar-spl-e2e-fee-payer.json 2>/dev/null)
          export FEE_PAYER_PUBLIC_KEY
          python3 -B - <<'PY'
          import base64
          import json
          import os
          import re
          import stat
          import urllib.request

          descriptor = os.open('/tmp/northstar-spl-e2e-state.env', os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW)
          with os.fdopen(descriptor, 'rb') as source:
              if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                  raise SystemExit('Retained state is not a regular file')
              raw = source.read(16385)
          if len(raw) > 16384:
              raise SystemExit('Retained state is too large')
          state = dict(line.split('=', 1) for line in raw.decode().splitlines() if line)
          addresses = {
              'fee_payer': os.environ['FEE_PAYER_PUBLIC_KEY'],
              'er_token_account': state['ER_TOKEN_ACCOUNT'],
          }
          if not all(re.fullmatch('[1-9A-HJ-NP-Za-km-z]{32,44}', value) for value in addresses.values()):
              raise SystemExit('Invalid public address in retained state')

          def rpc(port, method, params):
              request = urllib.request.Request(
                  f'http://127.0.0.1:{port}',
                  data=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': method, 'params': params}).encode(),
                  headers={'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)
              if result.get('error'):
                  raise SystemExit(f'{method} failed on port {port}')
              return result['result']

          print(json.dumps({'session': rpc(8910, 'getSessionPda', [])}))
          for role, address in addresses.items():
              for domain, port, commitment in [('l1', 8899, 'confirmed'), ('er', 8910, 'processed')]:
                  result = rpc(port, 'getAccountInfo', [address, {'encoding': 'base64', 'commitment': commitment}])
                  account = result['value']
                  summary = None if account is None else {
                      'owner': account['owner'],
                      'lamports': account['lamports'],
                      'data_len': len(base64.b64decode(account['data'][0], validate=True)),
                  }
                  print(json.dumps({'role': role, 'address': address, 'domain': domain, 'slot': result['context']['slot'], 'account': summary}))
          PY
