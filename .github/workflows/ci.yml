name: CI
run-name: Read-only retained native upload inspection

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full retained native deployment revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'mirrorworld-universe/northstar' && github.ref == 'refs/heads/native-upload-inspection'
    runs-on: devnet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect retained upload without signing or changing service state
        env:
          NATIVE_REVISION: ${{ inputs.revision }}
        run: |
          python3 -B - <<'PY'
          import fcntl, hashlib, json, os, re, stat, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from continuity_devnet import Rpc, LOADER, SERVICE
          from continuity_rollout_state import DEVNET, canonical, checked_directory, private_json, require, verify_artifacts
          revision = os.environ['NATIVE_REVISION']
          require(re.fullmatch('[0-9a-f]{40}', revision), 'full revision required')
          control = Path('/solana/northstar/continuity-v2') / revision / 'control'
          checked_directory(control, private=True)
          lock = os.open('/solana/northstar/continuity-v2-deploy.lock', os.O_RDONLY | os.O_NOFOLLOW)
          info = os.fstat(lock)
          require(stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and not info.st_mode & 0o077, 'invalid deployment lock')
          fcntl.flock(lock, fcntl.LOCK_SH | fcntl.LOCK_NB)
          reservation = private_json(control / 'reservation.json')
          plan = private_json(control / 'plan.json')
          require(plan['source_revision'] == revision == reservation['source_revision'], 'revision differs')
          require(hashlib.sha256(canonical(plan)).hexdigest() == reservation['plan_sha256'], 'plan binding differs')
          stage = Path(reservation['stage'])
          manifest = verify_artifacts(stage, revision)
          require(manifest['sha256'] == plan['artifacts'], 'artifacts differ')
          rpc = Rpc('https://api.devnet.solana.com')
          require(rpc.call('getGenesisHash') == DEVNET, 'not devnet')
          local = Rpc('http://127.0.0.1:8899')
          local_buffer = local.account(plan['programs']['portal-buffer'])
          print(json.dumps({'l1_health': local.call('getHealth'), 'l1_genesis_matches': local.call('getGenesisHash') == DEVNET,
                            'l1_confirmed': local.call('getSlot', [{'commitment': 'confirmed'}]),
                            'l1_finalized': local.call('getSlot', [{'commitment': 'finalized'}]),
                            'upstream_confirmed': rpc.call('getSlot', [{'commitment': 'confirmed'}]),
                            'l1_buffer_sha256': hashlib.sha256(local_buffer['raw'][37:]).hexdigest() if local_buffer else None}), flush=True)
          from continuity_rollout_state import ARTIFACTS
          from continuity_devnet import public_bytes
          print(json.dumps({'revision': revision, 'funder': plan['funder'], 'programs': plan['programs'],
                            'uploads': private_json(control / 'programs.json'),
                            'balance': rpc.call('getBalance', [plan['funder'], {'commitment': 'finalized'}])['value']}), flush=True)
          for role in ('portal', 'token_bridge'):
              image = (stage / ARTIFACTS[role]).read_bytes()
              for kind in (role, role + '-buffer'):
                  account = rpc.account(plan['programs'][kind])
                  view = {'role': kind, 'exists': account is not None}
                  if account:
                      raw = account['raw']
                      view.update(owner=account['owner'], executable=account['executable'], size=len(raw))
                      if kind.endswith('-buffer'):
                          bound = account['owner'] == LOADER and not account['executable'] and len(raw) >= 37 and raw[:4] == (1).to_bytes(4, 'little') and raw[4] == 1 and raw[5:37] == public_bytes(plan['funder'])
                          view['authority_bound'] = bound
                          if bound:
                              view['uploaded_sha256'] = hashlib.sha256(raw[37:]).hexdigest()
                              view['expected_sha256'] = hashlib.sha256(image).hexdigest()
                              view['length_matches'] = len(raw) == len(image) + 37
                              view['different_bytes'] = sum(left != right for left, right in zip(raw[37:], image))
                  print(json.dumps(view), flush=True)
          vrf_work = Path('/solana/northstar/vrf-service/deployments/d1ccaf33fafeea07137247bc4f180f7c19409fbb4b4e03ffed6ec0fb08a8f023/invocations/devnet-a22bb1150b89eb2e9bce4faf789039b35c169140')
          vrf_ids = private_json(vrf_work / 'identities.json')['program_ids']
          vrf_manifest = private_json(vrf_work / 'programs/manifest.json')
          for role, filename in {'coordinator': 'vrf_coordinator.so', 'verifier': 'vrf_verifier.so', 'consumer': 'test_consumer.so'}.items():
              image = (vrf_work / 'programs' / filename).read_bytes()
              require(hashlib.sha256(image).hexdigest() == vrf_manifest['programs'][filename], 'VRF artifact changed')
              program = local.account(vrf_ids[role])
              view = {'role': role, 'program': vrf_ids[role], 'required_bytes': len(image), 'elf_sha256': hashlib.sha256(image).hexdigest()}
              if program:
                  from continuity_devnet import public_text
                  require(program['owner'] == LOADER and program['executable'] and len(program['raw']) == 36, 'unexpected VRF program')
                  stored = local.account(public_text(program['raw'][4:]))
                  require(stored['owner'] == LOADER and stored['raw'][:4] == (3).to_bytes(4, 'little') and stored['raw'][12] == 1, 'unexpected VRF programdata')
                  capacity = len(stored['raw']) - 45
                  rent = local.call('getMinimumBalanceForRentExemption', [45 + max(capacity, len(image))])
                  view.update(capacity_bytes=capacity, extension_bytes=max(0, len(image) - capacity),
                              extra_rent_lamports=max(0, rent - stored['lamports']), authority=public_text(stored['raw'][13:45]))
              print(json.dumps({'vrf_capacity': view}), flush=True)
          er = Rpc('http://127.0.0.1:8910')
          print(json.dumps({'er_sync': er.call('northstarSysGetSyncStatus'), 'session': er.call('getSessionPda')}), flush=True)
          prepared = private_json(control / 'sdk-smoke/prepare-sol.json')
          payer = prepared['payer']
          print(json.dumps({'sol_payer': payer, 'balances': {level: er.call('getBalance', [payer, {'commitment': level}])['value']
                            for level in ('processed', 'confirmed', 'finalized')}}), flush=True)
          intent_path = control / 'sdk-smoke/controls/sol-withdraw/intent.json'
          if intent_path.exists():
              intent = private_json(intent_path)
              status = er.call('getSignatureStatuses', [[intent['signature']], {'searchTransactionHistory': True}])
              valid = er.call('isBlockhashValid', [intent['blockhash'], {'commitment': 'confirmed'}])
              print(json.dumps({'sol_withdraw_intent': {'signature': intent['signature'], 'wire_sha256': intent['wire_sha256'],
                                'last_valid_block_height': intent['last_valid_block_height'],
                                'current_block_height': er.call('getBlockHeight', [{'commitment': 'confirmed'}]),
                                'status': status, 'blockhash_valid': valid}}), flush=True)
              if valid.get('value') is True:
                  try:
                      simulated = er.call('simulateTransaction', [intent['wire_base64'], {'encoding': 'base64', 'sigVerify': True, 'commitment': 'confirmed'}])
                      print(json.dumps({'saved_wire_simulation': {'slot': simulated.get('context', {}).get('slot'),
                                        'err': simulated.get('value', {}).get('err'), 'units': simulated.get('value', {}).get('unitsConsumed')}}), flush=True)
                  except Exception as error:
                      print(json.dumps({'saved_wire_simulation_error': type(error).__name__}), flush=True)
          else:
              print(json.dumps({'sol_withdraw_intent': 'not created'}), flush=True)
          descriptor = os.open(control / 'operations.log', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
          info = os.fstat(descriptor)
          require(stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and not info.st_mode & 0o077, 'invalid private diagnostic log')
          os.lseek(descriptor, max(0, info.st_size - 65536), os.SEEK_SET)
          text = os.read(descriptor, 65536).decode('utf8', errors='replace')
          os.close(descriptor)
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          lines = [line.strip() for line in text.splitlines() if re.search(r'\b(?:[A-Za-z]*Error|ERROR)(?:\s*\[[A-Z0-9_]+\])?:', line)]
          selected = lines[-5:] if lines else text.splitlines()[-16:]
          for line in selected:
              if re.search(r'seed|secret|private.?key|mnemonic|passphrase|(?:\b\d{1,3},\s*){4}', line, re.I):
                  print(json.dumps({'cli_error': '[sensitive diagnostic omitted]'}))
              else:
                  print(json.dumps({'cli_error': re.sub(r'/(?:[^\s/]+/)+[^\s,;]+', '<path>', line.strip())[:300]}))
          result = subprocess.run(['systemctl', 'show', '--property=ActiveState', '--property=MainPID', SERVICE],
                                  check=True, capture_output=True, text=True, timeout=10)
          print(json.dumps({'native_service': result.stdout.splitlines()}))
          worker = subprocess.run(['systemctl', 'show', '--property=ActiveState', '--property=Result', '--property=ExecMainStatus', 'northstar-vrf-oracle.service'],
                                  check=True, capture_output=True, text=True, timeout=10)
          print(json.dumps({'oracle_service': worker.stdout.splitlines()}))
          journal = subprocess.run(['sudo', '-n', 'journalctl', '--unit=northstar-vrf-oracle.service', '--lines=40', '--no-pager', '--output=cat'],
                                   check=True, capture_output=True, text=True, timeout=20)
          for line in journal.stdout.splitlines()[-24:]:
              if re.search(r'(?:\b\d{1,3},\s*){4}|mnemonic|seed phrase|secret_key', line, re.I):
                  line = '[sensitive diagnostic omitted]'
              print(json.dumps({'oracle_log': re.sub(r'/(?:[^\s/]+/)+[^\s,;]+', '<path>', line)[:350]}))
          os.close(lock)
          PY
