name: CI
run-name: Resume reviewed native uploads with original identities

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type resume-retained-uploads to execute the reviewed recovery
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    if: github.repository == 'mirrorworld-universe/northstar' && github.ref == 'refs/heads/native-upload-recovery'
    runs-on: devnet
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Use existing Solana key utility
        run: |
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana-keygen"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          "$SOLANA_BIN/solana-keygen" --version
      - name: Verify explicit recovery scope
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = resume-retained-uploads
      - name: Resume only frozen native uploads over the bound local L1 RPC
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          SDK="$RUNNER_TEMP/native-upload-recovery-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/prepare-continuity-sdk.sh "$SDK"
          python3 -B .github/scripts/resume-native-upload.py --sdk-checkout "$SDK" --confirmation "$CONFIRMATION"
