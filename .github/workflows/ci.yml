name: CI

on:
  push:
    branches: [master, main, release]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ensure-rust-toolchain
      - run: rustup toolchain install nightly --component rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ensure-rust-toolchain
      - name: Clean stale build artifacts
        run: |
          pkill -9 rustc || true
          pkill -9 cargo || true
          rm -rf target
          rm -rf ~/.cargo/registry/src/**/.cargo-lock*
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libudev-dev libclang-dev
      - run: cargo clippy --all --tests -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ensure-rust-toolchain
      - name: Clean stale build artifacts
        run: |
          pkill -9 rustc || true
          pkill -9 cargo || true
          rm -rf target
          rm -rf ~/.cargo/registry/src/**/.cargo-lock*
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libudev-dev libclang-dev
      - name: Install Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Read Solana platform-tools version
        id: solana_tools
        run: |
          cargo build-sbf --version
          version=$(cargo build-sbf --version | awk '/platform-tools/{print $2}')
          echo "platform_tools_version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Solana platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install/active_release/bin/platform-tools-sdk/sbf/dependencies/platform-tools
          key: ${{ runner.os }}-solana-platform-tools-v3-${{ steps.solana_tools.outputs.platform_tools_version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-solana-platform-tools-v3-${{ steps.solana_tools.outputs.platform_tools_version }}-
      - name: Build Portal SBF program
        run: cargo build-sbf --manifest-path northstar/programs/portal/Cargo.toml
      - name: Build Token Bridge SBF program
        run: cargo build-sbf --manifest-path northstar/programs/token-bridge/Cargo.toml
      - name: Build test validator
        run: cargo build --bin solana-test-validator
      - name: Test devnet SPL smoke state format
        run: cargo test -p northstar-token-bridge --example devnet_smoke
      - name: Run SPL token bridge core tests
        run: BPF_OUT_DIR="$PWD/target/deploy" cargo test -p northstar-token-bridge --test core
      - name: Run SPL token bridge validator E2E
        run: BPF_OUT_DIR="$PWD/target/deploy" cargo test -p northstar-token-bridge --test validator_e2e -- --nocapture
      - name: Run Northstar crate tests
        run: cargo test -p northstar -p northstar-portal --no-fail-fast
      - name: Run Northstar SVM regression tests
        run: cargo test -p solana-svm northstar --no-fail-fast
      - name: Run Northstar core service tests
        run: cargo test -p solana-core northstar_service --no-fail-fast

  deploy:
    name: Build and Deploy on Devnet
    needs: [fmt, clippy, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: [devnet]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for program changes
        id: program_changes
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          # Compare against the previous state of this branch (the base branch
          # before the push). Fall back to HEAD~1..HEAD for new/force-pushed
          # branches where the before commit is unreachable.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            echo "Comparing $BEFORE..HEAD" >&2
            CHANGED_FILES=$(git diff --name-only "$BEFORE" HEAD)
          else
            echo "Before commit unavailable; comparing HEAD~1..HEAD" >&2
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -qE '^northstar/programs/portal/'; then
            echo "portal_changed=true" >> "$GITHUB_OUTPUT"
            echo "Portal program files changed"
          else
            echo "portal_changed=false" >> "$GITHUB_OUTPUT"
            echo "No portal program file changes"
          fi
          if echo "$CHANGED_FILES" | grep -qE '^northstar/programs/token-bridge/'; then
            echo "token_bridge_changed=true" >> "$GITHUB_OUTPUT"
            echo "Token bridge program files changed"
          else
            echo "token_bridge_changed=false" >> "$GITHUB_OUTPUT"
            echo "No token bridge program file changes"
          fi

      - uses: ./.github/actions/ensure-rust-toolchain

      - name: Ensure Solana CLI is available
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
            echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          fi
          solana --version

      - name: Build SBF programs
        run: |
          set -euo pipefail
          mkdir -p /solana/northstar/deploy
          SBF_OUT_DIR=/solana/northstar/deploy ./cargo-build-sbf --manifest-path northstar/programs/portal/Cargo.toml
          SBF_OUT_DIR=/solana/northstar/deploy ./cargo-build-sbf --manifest-path northstar/programs/token-bridge/Cargo.toml

      - name: Build validator binary
        run: cargo build --release --target-dir /solana/northstar/ --bin agave-validator

      - name: Build Northstar Solana CLI
        run: cargo build --release --target-dir /solana/northstar/ --package solana-cli --bin solana --no-default-features

      - name: Confirm binary exists
        run: |
          set -euo pipefail
          BIN="/solana/northstar/release/agave-validator"
          test -f "$BIN" && test -x "$BIN" && "$BIN" --version

      - name: Generate new portal program address
        id: portal_address
        if: steps.program_changes.outputs.portal_changed == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          KEYPAIR="/solana/northstar/portal-keypair.json"
          rm -f "$KEYPAIR"
          solana-keygen new --outfile "$KEYPAIR" --force --no-passphrase
          PUBKEY=$(solana-keygen pubkey "$KEYPAIR")
          echo "portal_address=$PUBKEY" >> "$GITHUB_OUTPUT"
          echo "New portal program address: $PUBKEY"

      - name: Deploy portal program to devnet
        id: portal_deploy
        if: steps.program_changes.outputs.portal_changed == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          PUBKEY="${{ steps.portal_address.outputs.portal_address }}"
          echo "Deploying portal program to devnet at $PUBKEY"
          solana program deploy \
            /solana/northstar/deploy/northstar_portal.so \
            --program-id /solana/northstar/portal-keypair.json \
            --url https://api.devnet.solana.com \
            --keypair /home/ubuntu/.config/solana/id.json
          echo "Portal program deployed to devnet at $PUBKEY"
          echo "portal_address=$PUBKEY" >> "$GITHUB_OUTPUT"

      - name: Generate new token bridge program address
        id: token_bridge_address
        if: steps.program_changes.outputs.token_bridge_changed == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          KEYPAIR="/solana/northstar/token-bridge-keypair.json"
          rm -f "$KEYPAIR"
          solana-keygen new --outfile "$KEYPAIR" --force --no-passphrase
          PUBKEY=$(solana-keygen pubkey "$KEYPAIR")
          echo "token_bridge_address=$PUBKEY" >> "$GITHUB_OUTPUT"
          echo "New token bridge program address: $PUBKEY"

      - name: Deploy token bridge program to devnet
        id: token_bridge_deploy
        if: steps.program_changes.outputs.token_bridge_changed == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          PUBKEY="${{ steps.token_bridge_address.outputs.token_bridge_address }}"
          echo "Deploying token bridge program to devnet at $PUBKEY"
          solana program deploy \
            /solana/northstar/deploy/northstar_token_bridge.so \
            --program-id /solana/northstar/token-bridge-keypair.json \
            --url https://api.devnet.solana.com \
            --keypair /home/ubuntu/.config/solana/id.json
          echo "Token bridge program deployed to devnet at $PUBKEY"
          echo "token_bridge_address=$PUBKEY" >> "$GITHUB_OUTPUT"

      - name: Update validator service with new portal address
        if: steps.program_changes.outputs.portal_changed == 'true'
        run: |
          set -euo pipefail
          SERVICE_FILE="/etc/systemd/system/northstar-validator.service"
          PUBKEY="${{ steps.portal_address.outputs.portal_address }}"
          sudo sed -i "s/--portal [^ ]*/--portal $PUBKEY/" "$SERVICE_FILE"
          echo "Updated $SERVICE_FILE with portal address $PUBKEY"
          grep -- "--portal" "$SERVICE_FILE"

      - name: Reload systemd
        if: steps.program_changes.outputs.portal_changed == 'true'
        run: sudo systemctl daemon-reload

      - name: Restart validator
        run: sudo systemctl restart northstar-validator

      - name: Wait for validator to be fully up
        run: |
          sudo mkdir -p /solana/northstar/logs
          sudo touch /solana/northstar/logs/validator.log
          sudo chmod a+rw /solana/northstar/logs/validator.log

          # Stream validator logs to CI output while we wait
          tail -f /solana/northstar/logs/validator.log &
          TAIL_PID=$!

          # shellcheck disable=SC2329
          cleanup() {
            kill "$TAIL_PID" 2>/dev/null || true
            wait "$TAIL_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2

          echo "Waiting for validator to be fully up..."
          for _ in $(seq 1 1080); do
            if sudo systemctl is-failed --quiet northstar-validator; then
              echo ""
              echo "Validator service failed during startup!"
              exit 1
            fi

            if sudo systemctl is-active --quiet northstar-validator; then
              if curl -sf -X POST -H "Content-Type: application/json" \
                 -d '{"jsonrpc":"2.0","id":1,"method":"getVersion"}' \
                 http://localhost:8899 >/dev/null 2>&1; then
                echo ""
                echo "Validator is up and RPC is responding!"
                exit 0
              fi
            fi
            sleep 5
          done

          echo ""
          echo "Timed out waiting for validator to be fully up"
          exit 1
        timeout-minutes: 90

      - name: Open Portal session on devnet
        if: steps.program_changes.outputs.portal_changed == 'true'
        run: |
          set -euo pipefail
          SOLANA_CLI="/solana/northstar/release/solana"
          PORTAL_ADDRESS="${{ steps.portal_address.outputs.portal_address }}"
          DEPLOYER_KEYPAIR="/home/ubuntu/.config/solana/id.json"
          DEVNET_RPC="https://api.devnet.solana.com"

          test -x "$SOLANA_CLI"
          VALIDATOR_IDENTITY=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"getIdentity"}' \
            http://localhost:8899 | sed -n 's/.*"identity":"\([^"]*\)".*/\1/p')
          test -n "$VALIDATOR_IDENTITY"

          echo "Opening session for portal $PORTAL_ADDRESS with validator $VALIDATOR_IDENTITY"
          "$SOLANA_CLI" \
            --url "$DEVNET_RPC" \
            --keypair "$DEPLOYER_KEYPAIR" \
            --commitment confirmed \
            portal open-session \
            --portal "$PORTAL_ADDRESS" \
            --validator "$VALIDATOR_IDENTITY"

      - name: Run SOL deposit, resume, withdrawal, and settlement smoke test
        id: sol_e2e_smoke
        timeout-minutes: 45
        env:
          PORTAL_ADDRESS: ${{ steps.portal_deploy.outputs.portal_address }}
          REPORT_PATH: /tmp/northstar-sol-e2e-report.txt
        run: ./.github/scripts/devnet-e2e-smoke.sh

      - name: Run SPL deposit, resume, withdrawal, and settlement smoke test
        id: spl_e2e_smoke
        timeout-minutes: 45
        env:
          PORTAL_ADDRESS: ${{ steps.portal_deploy.outputs.portal_address }}
          TOKEN_BRIDGE_ADDRESS: ${{ steps.token_bridge_deploy.outputs.token_bridge_address }}
          REPORT_PATH: /tmp/northstar-spl-e2e-report.txt
        run: ./.github/scripts/devnet-spl-e2e-smoke.sh

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          STATUS: ${{ job.status }}
          PORTAL_CHANGED: ${{ steps.program_changes.outputs.portal_changed }}
          PORTAL_ADDRESS: ${{ steps.portal_deploy.outputs.portal_address }}
          TOKEN_BRIDGE_CHANGED: ${{ steps.program_changes.outputs.token_bridge_changed }}
          TOKEN_BRIDGE_ADDRESS: ${{ steps.token_bridge_deploy.outputs.token_bridge_address }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SOL_SMOKE_OUTCOME: ${{ steps.sol_e2e_smoke.outcome }}
          SPL_SMOKE_OUTCOME: ${{ steps.spl_e2e_smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$STATUS" != "success" ]; then
            exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          USERS_RESPONSE=$(curl -sS -G \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data-urlencode "limit=200" \
            https://slack.com/api/users.list)
          if ! jq -e '.ok == true' >/dev/null <<<"$USERS_RESPONSE"; then
            echo "Failed to list Slack users: $USERS_RESPONSE" >&2
            exit 1
          fi

          resolve_user_id() {
            local name="$1"
            jq -r --arg name "$name" '
              .members[]
              | select(.deleted != true)
              | select(
                  .name == $name
                  or .real_name == $name
                  or .profile.real_name == $name
                  or .profile.display_name == $name
                )
              | .id
            ' <<<"$USERS_RESPONSE" | head -n 1
          }

          MENTIONS=""
          for USER_NAME in "Ivan Rybin" "Bilal Afzal" "Bai Xiong" "_bakebwa.sol"; do
            USER_ID=$(resolve_user_id "$USER_NAME")
            if [ -z "$USER_ID" ]; then
              echo "Could not resolve Slack user: $USER_NAME" >&2
              exit 1
            fi
            MENTIONS="$MENTIONS<@$USER_ID> "
          done

          LINES=(":white_check_mark: NorthStar validator deployment succeeded.")
          if [ "$PORTAL_CHANGED" = "true" ] && [ -n "$PORTAL_ADDRESS" ]; then
            LINES+=(
              ":rocket: Portal program changed and deployed at: \`$PORTAL_ADDRESS\`"
              ":link: Portal explorer: https://explorer.solana.com/address/$PORTAL_ADDRESS?cluster=devnet"
            )
          elif [ "$PORTAL_CHANGED" = "true" ]; then
            LINES+=(":warning: Portal program changed but deployment failed or was skipped.")
          fi

          if [ "$TOKEN_BRIDGE_CHANGED" = "true" ] && [ -n "$TOKEN_BRIDGE_ADDRESS" ]; then
            LINES+=(
              ":rocket: Token bridge program changed and deployed at: \`$TOKEN_BRIDGE_ADDRESS\`"
              ":link: Token bridge explorer: https://explorer.solana.com/address/$TOKEN_BRIDGE_ADDRESS?cluster=devnet"
            )
          elif [ "$TOKEN_BRIDGE_CHANGED" = "true" ]; then
            LINES+=(":warning: Token bridge program changed but deployment failed or was skipped.")
          fi

          if [ "$PORTAL_CHANGED" != "true" ] && [ "$TOKEN_BRIDGE_CHANGED" != "true" ]; then
            LINES+=(":information_source: No Portal or token bridge program changes.")
          fi
          LINES+=(
            ":memo: Commit: \`$COMMIT_SHA\`"
            "$COMMIT_MSG"
          )
          TEXT=$(printf '%s\n' "${LINES[@]}")
          TEXT="$MENTIONS"$'\n'"$TEXT"
          PAYLOAD=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$TEXT" '{channel: $channel, text: $text}')
          MESSAGE_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            https://slack.com/api/chat.postMessage)
          if ! jq -e '.ok == true' >/dev/null <<<"$MESSAGE_RESPONSE"; then
            echo "Failed to post Slack message: $MESSAGE_RESPONSE" >&2
            exit 1
          fi

          MESSAGE_TS=$(jq -r '.ts' <<<"$MESSAGE_RESPONSE")
          PIN_PAYLOAD=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg timestamp "$MESSAGE_TS" '{channel: $channel, timestamp: $timestamp}')
          PIN_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json' \
            --data "$PIN_PAYLOAD" \
            https://slack.com/api/pins.add)
          if ! jq -e '.ok == true' >/dev/null <<<"$PIN_RESPONSE"; then
            echo "Failed to pin Slack message: $PIN_RESPONSE" >&2
            exit 1
          fi

          if [ "$SOL_SMOKE_OUTCOME" != "skipped" ] && [ -f /tmp/northstar-sol-e2e-report.txt ]; then
            SOL_REPORT=$(cat /tmp/northstar-sol-e2e-report.txt)
          else
            SOL_REPORT=$(printf '%s\n%s' \
              ':test_tube: Devnet SOL smoke status: *skipped*' \
              ':information_source: The SOL smoke step did not run because an earlier deployment step failed.')
          fi
          if [ "$SPL_SMOKE_OUTCOME" != "skipped" ] && [ -f /tmp/northstar-spl-e2e-report.txt ]; then
            SPL_REPORT=$(cat /tmp/northstar-spl-e2e-report.txt)
          else
            SPL_REPORT=$(printf '%s\n%s' \
              ':test_tube: Devnet SPL smoke status: *skipped*' \
              ':information_source: The SPL smoke step did not run because an earlier deployment step failed.')
          fi
          E2E_REPORT=$(printf '%s\n\n%s' "$SOL_REPORT" "$SPL_REPORT")
          THREAD_PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg thread_ts "$MESSAGE_TS" \
            --arg text "$E2E_REPORT" \
            '{channel: $channel, thread_ts: $thread_ts, text: $text}')
          THREAD_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json' \
            --data "$THREAD_PAYLOAD" \
            https://slack.com/api/chat.postMessage)
          if ! jq -e '.ok == true' >/dev/null <<<"$THREAD_RESPONSE"; then
            echo "Failed to post E2E report thread: $THREAD_RESPONSE" >&2
            exit 1
          fi
