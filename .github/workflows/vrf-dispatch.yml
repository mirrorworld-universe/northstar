name: Notify oracle after devnet deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'mirrorworld-universe/northstar' &&
      vars.NORTHSTAR_VRF_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create oracle-only dispatch credential
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NORTHSTAR_VRF_DISPATCH_APP_ID }}
          private-key: ${{ secrets.NORTHSTAR_VRF_DISPATCH_APP_KEY }}
          owner: mirrorworld-universe
          repositories: vrf-oracle
          permission-actions: write
      # Sonic: Send public provenance only; the oracle independently validates it.
      - name: Dispatch oracle-owned deployment
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST repos/mirrorworld-universe/vrf-oracle/actions/workflows/deploy-devnet.yml/dispatches \
            -f ref=main \
            -f "inputs[northstar_run_id]=$SOURCE_RUN_ID" \
            -f "inputs[northstar_run_attempt]=$SOURCE_ATTEMPT" \
            -f "inputs[northstar_revision]=$SOURCE_REVISION"
          printf '%s\n' 'Oracle deployment requested. This does not assert oracle readiness.' \
            '[Track oracle deployment](https://github.com/mirrorworld-universe/vrf-oracle/actions/workflows/deploy-devnet.yml)' >> "$GITHUB_STEP_SUMMARY"
